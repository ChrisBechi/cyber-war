name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gnu-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .tools/coreutils-reference/*.apk
            .tools/coreutils-reference/*.tar.gz
          key: gnu-reference-${{ runner.os }}-${{ hashFiles('content/cli-compatibility/coreutils-environment.json') }}
      - run: python3 scripts/cli/coreutils-environment.py prepare
      - run: python3 scripts/cli/coreutils-environment.py run --verify --wave foundation
      - run: python3 scripts/cli/coreutils-environment.py run --verify --command cat
      - run: python3 scripts/cli/coreutils-environment.py run --verify --command head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:check
      - run: pnpm test

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm cli:check
      - run: pnpm cli:verify --wave foundation --strict
      - run: pnpm cli:verify --command cat --strict
      - run: pnpm cli:verify --command head --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-compatibility
          path: |
            artifacts/cli-*.json
            docs/generated/*.md
